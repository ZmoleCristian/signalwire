[package]
name = "signalwire"
version = "0.2.0"
edition = "2024"
authors = ["Zmole Cristian <chiarel@tragdate.ninja>"]
description = "The unofficial SignalWire SDK for Rust."
license = "0BSD"
documentation = "https://docs.rs/signalwire"
repository = "https://github.com/ZmoleCristian/signalwire"
homepage = "https://tragdate.ninja"
keywords = ["voip", "signalwire", "communication", "telephony", "sdk"]
categories = ["network-programming", "asynchronous", "api-bindings"]
readme = "README.md"

[features]
default = []
blocking = ["reqwest/blocking"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
dotenvy = "0.15"
